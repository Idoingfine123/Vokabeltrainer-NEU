/* ============ DESIGN SYSTEM ============ */

 --amber:#fbbf24;--amber-soft:#34240b;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}::-webkit-scrollbar-thumb:hover{background:var(--faint)}

.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}

.blob.b3{background:radial-gradient(circle,rgba(6,182,212,.35),transparent 65%)}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,36px) scale(1.12)}}
/* layout */
.app{position:relative;z-index:1;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--nav-w);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;z-index:40}

.main{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{min-height:78px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 34px;position:sticky;top:0;z-index:20}

.content{max-width:1240px;width:100%;margin:0 auto;padding:28px 34px 70px;flex:1}
/* cards & grids */
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:22px;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) backwards}

.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}

.btn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:13px;padding:11px 16px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--faint)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 24px rgba(99,102,241,.35)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 14px 30px rgba(99,102,241,.45)}
.btn.green{background:linear-gradient(135deg,#10b981,#059669);border:0;color:#fff;box-shadow:0 10px 24px rgba(16,185,129,.3)}
.btn.danger{color:var(--red);border-color:var(--line2);background:transparent}

.hero::before{width:340px;height:340px;right:-110px;top:-130px}

.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.ring{transform:rotate(-90deg)}

.mi-vocab{background:var(--accent-soft)}.mi-rate{background:var(--green-soft)}.mi-fire{background:var(--amber-soft)}.mi-bolt{background:#f3e8ff}.mi-loop{background:#e0f2fe}.mi-users{background:#fce7f3}

.bb1{background:var(--red-soft);color:var(--red)}.bb2{background:var(--amber-soft);color:var(--amber)}.bb3{background:#e0f2fe;color:#0284c7}.bb4{background:#e0e7ff;color:#4f46e5}.bb5{background:var(--green-soft);color:var(--green)}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.input,.textarea,select.input{width:100%;border:1.5px solid var(--line2);background:var(--surface);border-radius:13px;padding:12px 14px;outline:0;font-size:13.5px;transition:all .18s}

th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);font-weight:800;position:sticky;top:0}
.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.stats-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.chart{height:240px;display:flex;align-items:flex-end;gap:10px;padding:22px 8px 8px}

function buildQueue(m,l){const F=getFilteredVocab();let pool;if(m==="spaced"){const weighted=[];F.forEach(v=>{for(let i=0;i<Math.max(1,6-(v.box||1));i++)weighted.push(v)});pool=shuffle(weighted)}else pool=shuffle(F);const want=levelCount(l),out=[],used=new Set();for(const v of pool){if(!used.has(v.id)){used.add(v.id);out.push(v)}if(out.length>=want)break}return out}

 const map=new Map(state.vocab.map(v=>[String(v.id),v]));
 let mainQueue=null,retryQueue=[];
 if(custom){mainQueue=custom.queue.slice()}
 else if(p&&p.mainIds&&p.mainIds.length){mainQueue=p.mainIds.map(id=>map.get(String(id))).filter(Boolean);retryQueue=(p.retryIds||[]).map(id=>map.get(String(id))).filter(Boolean)}
 else if(p&&p.ids&&p.ids.length){mainQueue=p.ids.map(id=>map.get(String(id))).filter(Boolean)}

 if(!mainQueue.length){toast("Keine Vokabeln für diese Runde.","err");return}

 const v=q[session.index];clearInterval(speedTimer);

}
function openBulkModal(){
 showModal("📋 Viele Vokabeln auf einmal",`<p class="muted" style="font-size:12.5px;margin-top:0">Eine Vokabel pro Zeile, getrennt mit <strong>=</strong> (geht auch Tab oder Semikolon). Ideal zum Abtippen aus dem Buch!</p><div class="formrow"><label>Format</label><div class="seg" id="bulkDir"><button data-bd="de-fr" class="on">Deutsch = Français</button><button data-bd="fr-de">Français = Deutsch</button></div></div><div class="formrow"><label>Unit / Tag für alle</label><input id="bulkTag" class="input" list="taglist2" placeholder="z. B. Unité 6"><datalist id="taglist2">${getAllTags().map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div><div class="formrow"><label>Liste einfügen</label><textarea id="bulkText" class="textarea" placeholder="der Apfel = la pomme&#10;das Buch = le livre&#10;…"></textarea><div class="hint" id="bulkCount">0 Vokabeln erkannt</div></div><button class="btn primary" id="doBulk">✓ Importieren</button>`);
 let bd="de-fr";
 document.querySelectorAll("#bulkDir button").forEach(b=>b.onclick=()=>{bd=b.dataset.bd;document.querySelectorAll("#bulkDir button").forEach(x=>x.classList.toggle("on",x===b));countBulk()});
 const ta=$("bulkText");ta.oninput=countBulk;
 function parseBulk(){return ta.value.split("\n").map(l=>{let parts=null,us="=";for(const sep of ["=","\t",";"]){if(l.includes(sep)){parts=l.split(sep);us=sep;break}}if(!parts||parts.length<2)return null;let a=parts[0].trim(),b=parts.slice(1).join(us).trim();if(!a||!b)return null;return bd==="de-fr"?{de:a,fr:b}:{de:b,fr:a}}).filter(Boolean)}
 function countBulk(){$("bulkCount").textContent=parseBulk().length+" Vokabeln erkannt"}
 $("doBulk").onclick=()=>{const items=parseBulk(),tag=$("bulkTag").value.trim();if(!items.length){toast("Keine gültigen Zeilen gefunden.","err");return}items.forEach((it,i)=>state.vocab.push({id:"b"+Date.now().toString(36)+i+Math.floor(Math.random()*999),fr:it.fr,de:it.de,tag,correct:0,wrong:0,box:1,fav:false,lastLearned:null}));save();checkAch();closeModal();renderPage();toast(`${items.length} Vokabeln hinzugefügt 🎉`,"ok");launchConfetti(70)};
}
function openImportModal(){
 showModal("⇪ Importieren",`<p class="muted" style="font-size:12.5px;margin-top:0">JSON-Backup <strong>ersetzt</strong> alle Vokabeln (inkl. Fortschritt). Für einzelne Listen nutze lieber „📋 Liste“.</p><div class="actions" style="margin-top:0;margin-bottom:14px"><button class="btn primary" id="fileBtn">${icon("ul",15)} Datei wählen (.json)</button><input type="file" id="fileInput" accept=".json,application/json" style="display:none"></div><div class="formrow"><label>Oder JSON hier einfügen</label><textarea id="importJson" class="textarea" style="min-height:110px" placeholder='{"vocab":[...]}'></textarea></div><button class="btn" id="doImport">Aus Text importieren</button>`);
 $("fileBtn").onclick=()=>$("fileInput").click();
 $("fileInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>doImportJSON(String(rd.result||""));rd.readAsText(f)};
 $("doImport").onclick=()=>doImportJSON($("importJson").value);
}
function doImportJSON(txt){try{const x=JSON.parse(txt);if(!x||!Array.isArray(x.vocab))throw 0;const clean=x.vocab.filter(v=>v&&(typeof v.de==="string"||typeof v.fr==="string")).map((v,i)=>({id:String(v.id||("i"+Date.now()+i)),de:String(v.de||""),fr:String(v.fr||""),tag:String(v.tag||""),correct:+v.correct||0,wrong:+v.wrong||0,box:Math.min(5,Math.max(1,+v.box||1)),fav:!!v.fav,lastLearned:v.lastLearned||null}));if(!clean.length)throw 0;if(!confirm(clean.length+" Vokabeln importieren? Dein aktueller Stand wird ersetzt."))return;state=Object.assign(loadState(),x,{vocab:clean});if(!Array.isArray(state.selectedTags))state.selectedTags=null;if(!state.progress)state.progress={};save();closeModal();renderPage();toast("Import erfolgreich 🎉","ok")}catch(e){toast("Ungültige JSON-Datei.","err")}}
function openExportModal(){
 showModal("⇩ Exportieren",`<p class="muted" style="font-size:12.5px;margin-top:0">Sichere deinen Stand als Backup oder öffne die Tabelle in Excel.</p><div class="actions" style="margin-top:0"><button class="btn primary" id="expJson">${icon("dl",15)} JSON-Backup (alles)</button><button class="btn" id="expCsv">${icon("dl",15)} CSV-Tabelle (Excel)</button></div>`);
 $("expJson").onclick=()=>{exportJSON();closeModal()};$("expCsv").onclick=()=>{exportCSV();closeModal()};
}
function showModal(t,b){$("modalTitle").textContent=t;$("modalContent").innerHTML=b;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
function download(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}
function exportJSON(){download("vokabel-trainer-backup.json",JSON.stringify(state,null,2),"application/json");toast("Backup heruntergeladen 💾","ok")}
function exportCSV(){const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;const rows=[["Deutsch","Französisch","Unit","Box","Richtig","Falsch","Favorit"].join(";")];state.vocab.forEach(v=>rows.push([q(v.de),q(v.fr),q(v.tag),v.box||1,v.correct||0,v.wrong||0,v.fav?"ja":"nein"].join(";")));download("vokabeln.csv","﻿"+rows.join("\r\n"),"text/csv;charset=utf-8");toast("CSV heruntergeladen 📊","ok")}
/* ================= GLOBAL EVENTS ================= */
document.addEventListener("click",e=>{
 const spk=e.target.closest("[data-speak]");
 if(spk){e.preventDefault();const raw=spk.dataset.speak||"",ci=raw.indexOf(":");const lang=raw.slice(0,ci)==="fr"?"fr-FR":"de-DE";speak(decodeURIComponent(raw.slice(ci+1)),lang);return}
 if(!$("exercise").classList.contains("show"))return;
 const q=e.target.closest("[data-answer]");
 if(q&&session&&session.mode==="quiz"){e.preventDefault();quizAnswer(q);return}
 if(e.target.closest("#speakFlash")){e.preventDefault();const v=currentVocab();if(v)speakFrench(v.fr);return}
 if(e.target.closest("#favFlash")){e.preventDefault();toggleFavCurrent();return}
 if(e.target.id==="flipBtn"){flipCurrent();return}
 if(e.target.id==="known"){answerCurrent(true);return}
 if(e.target.id==="notKnown"){answerCurrent(false);return}
 if(e.target.id==="writeCheck"){checkWrite();return}
 if(e.target.id==="writeSkip"){skipWrite();return}
 const ac=e.target.closest("[data-accent]");
 if(ac&&session&&session.mode==="write"){const input=$("writeinput");if(!input)return;const p=input.selectionStart??input.value.length,q2=input.selectionEnd??p;input.value=input.value.slice(0,p)+ac.dataset.accent+input.value.slice(q2);input.focus();input.selectionStart=input.selectionEnd=p+ac.dataset.accent.length;return}
 const sp=e.target.closest("[data-speed]");
 if(sp&&session&&session.mode==="speed"){const v=currentVocab();if(!v||sp.disabled)return;const lang=DIRMETA[qdir()].a,ok=markAnswers(sp,v,"[data-speed]",lang);record(v,ok);session.correct+=ok?1:0;session.wrong+=ok?0:1;moveToNext(ok,v);setTimeout(()=>{if(!session)return;if(session.phase==="retry"&&session.retryQueue.length===0){endRound();return}if(session.phase==="main"&&$("timer")&&$("timer").textContent==="0"){finishSpeed();return}renderSpeed()},300)}
});
document.addEventListener("keydown",e=>{
 if($("modal").classList.contains("show")){if(e.key==="Escape")closeModal();return}
 if(!$("exercise").classList.contains("show")||!session)return;
 if((session.mode==="quiz"||session.mode==="speed")&&["1","2","3","4"].includes(e.key)){const btns=[...document.querySelectorAll(session.mode==="quiz"?"[data-answer]":"[data-speed]")];const b=btns[Number(e.key)-1];if(b&&!b.disabled){e.preventDefault();b.click()}return}
 if(session.mode==="flash"&&e.code==="Space"){e.preventDefault();flipCurrent();return}
 if(session.mode==="flash"&&e.key==="ArrowRight"&&flipped){e.preventDefault();answerCurrent(true);return}
 if(session.mode==="flash"&&e.key==="ArrowLeft"&&flipped){e.preventDefault();answerCurrent(false);return}
 if(e.key==="f"||e.key==="F"){if(document.activeElement&&document.activeElement.tagName==="INPUT")return;e.preventDefault();toggleFavCurrent();return}
 if(e.key==="s"||e.key==="S"){if(document.activeElement&&document.activeElement.tagName==="INPUT")return;const v=currentVocab();if(v){e.preventDefault();speakFrench(v.fr)}return}
 if(session.mode==="write"&&e.key==="Enter"){e.preventDefault();checkWrite()}
});
document.addEventListener("pointerdown",()=>ensureAudio(),{once:true});
/* ================= INIT ================= */
applyTheme();
renderPage();
